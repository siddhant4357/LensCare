<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150">
  <defs>
    <linearGradient id="lensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a4a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:1" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Left Lens -->
  <path d="M110 50 C 90 50, 70 75, 70 95 C 70 115, 90 135, 110 135 C 130 135, 150 115, 150 95 C 150 75, 130 50, 110 50 Z" fill="none" stroke="url(#lensGradient)" stroke-width="8" stroke-linecap="round" filter="url(#dropShadow)"/>
  
  <!-- Right Lens -->
  <path d="M220 50 C 200 50, 180 75, 180 95 C 180 115, 200 135, 220 135 C 240 135, 260 115, 260 95 C 260 75, 240 50, 220 50 Z" fill="none" stroke="url(#lensGradient)" stroke-width="8" stroke-linecap="round" filter="url(#dropShadow)"/>
  
  <!-- Bridge -->
  <path d="M150 85 Q 165 70, 180 85" fill="none" stroke="url(#lensGradient)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Temple pieces (Arms hinge) -->
  <path d="M40 75 L 70 95" fill="none" stroke="url(#lensGradient)" stroke-width="6" stroke-linecap="round"/>
  <path d="M290 75 L 260 95" fill="none" stroke="url(#lensGradient)" stroke-width="6" stroke-linecap="round"/>

  <!-- Text -->
  <text x="290" y="110" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="80" fill="url(#textGradient)" letter-spacing="-2">LensCare</text>
  
  <!-- Accent/Reflection -->
  <path d="M95 65 Q 110 60, 120 75" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
  <path d="M205 65 Q 220 60, 230 75" fill="none" stroke="white" stroke-width="3" opacity="0.5"/>
</svg>
